schema: sapi-lab/v0
spec_revision: 06ddd3333109cea8a2cb3071609070d7a3c0d3ff
workflow:
  id: crm-reference
  revision: 1
  kind: Pipeline
  inputs: {}
  steps:
  - id: inquiry
    kind: Script
    uses: inquiry.read
    with: {}
  - id: identity
    kind: Script
    uses: json.parse
    with:
      text:
        ref: steps.inquiry.result_json
  - id: documents
    kind: Script
    uses: documents.read
    with: {}
  - id: research
    kind: Script
    uses: research.read
    with: {}
  - id: clarify
    kind: Script
    uses: customer.ask
    with:
      questions:
      - What are your budget, timeline, volume, languages, CRM, channel and human
        handoff requirements?
  - id: facts
    kind: Script
    uses: json.parse
    with:
      text:
        ref: steps.clarify.result_json
  - id: before
    kind: Script
    uses: crm.read
    with: {}
  - id: update
    kind: Script
    uses: crm.update
    with:
      changes:
        budget_aed:
          ref: steps.facts.value.value.budget_aed
        timeline_weeks:
          ref: steps.facts.value.value.timeline_weeks
        volume:
          ref: steps.facts.value.value.volume
        languages:
          ref: steps.facts.value.value.languages
        crm:
          ref: steps.facts.value.value.crm
        channel:
          ref: steps.facts.value.value.channel
        human_handoff:
          ref: steps.facts.value.value.human_handoff
        status: Qualified
        next_action: discovery_call
        owner: sales_coordinator
  - id: followup
    kind: Script
    uses: followup.create
    with:
      lead_id:
        ref: steps.identity.value.value.lead_id
      type: discovery_call
      status: pending_scheduling
  - id: respond
    kind: Script
    uses: customer.send
    with:
      recipient:
        ref: steps.identity.value.value.contact
      body: Your stated requirements appear suitable for discovery. Salesforce integration
        is subject to assessment; pricing, dates, accuracy and compliance are not
        guaranteed. Please share availability for a discovery call; scheduling is
        pending.
  - id: readback
    kind: Script
    uses: crm.read
    with: {}
  - id: report
    kind: Script
    uses: report.evidence
    with:
      narrative: 'The requested actions qualify the existing lead, preserve its identity,
        create a discovery follow-up pending scheduling and send the customer a bounded
        response. Consult the actual receipts below for success or failure. Next:
        sales_coordinator should agree availability and assess integration, scope,
        pricing, delivery dates and compliance before any commitment.'
      evidence:
      - ref: steps.inquiry.result_json
      - ref: steps.documents.result_json
      - ref: steps.research.result_json
      - ref: steps.clarify.result_json
      - ref: steps.update.result_json
      - ref: steps.followup.result_json
      - ref: steps.respond.result_json
      - ref: steps.readback.result_json
  dependencies:
  - - inquiry
    - identity
  - - identity
    - documents
  - - documents
    - research
  - - research
    - clarify
  - - clarify
    - facts
  - - facts
    - before
  - - before
    - update
  - - update
    - followup
  - - followup
    - respond
  - - respond
    - readback
  - - readback
    - report
  acceptance: Original CRM state and evidence verification
  output:
    final_answer:
      ref: steps.report.final_answer
activation:
  kind: Callback
  rule_id: crm-qualification-requested
  hook: benchmark.crm_qualification_requested
  condition: valid_input
  reaction: Trigger
  workflow_ref:
    id: crm-reference
    revision: 1
execution:
  concurrency: independent
  deadline_seconds: 120
  on_step_error: fail
