services:
  main:
    depends_on:
      simulator:
        condition: service_healthy
    volumes:
      - checkout-credentials:/run/checkout:ro
    networks: [verification]
  simulator:
    build:
      context: ${CONTEXT_DIR}
      dockerfile: Dockerfile
    command: [python3, -m, payload.environment.server]
    volumes:
      - checkout-credentials:/run/checkout
    networks: [verification]
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1).read()"]
      interval: 1s
      timeout: 2s
      retries: 30
networks:
  verification:
    internal: true
volumes:
  checkout-credentials:
