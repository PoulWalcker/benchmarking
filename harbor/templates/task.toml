version = "1.0"

[metadata]
name = "${name}"
description = "Execute a Sapiens-inspired YAML definition in pinned real n8n and verify task data and execution invariants."
difficulty = "medium"
category = "workflow-execution"
tags = ["sapi-lab", "n8n", "yaml", "runtime"]

[agent]
timeout_sec = ${agent_timeout_sec}

[verifier]
# Shared container is safe only while the candidate is an uploaded YAML; an agent with a shell needs environment_mode = "separate".
timeout_sec = ${verifier_timeout_sec}

[environment]
build_timeout_sec = ${build_timeout_sec}
cpus = ${cpus}
memory_mb = ${memory_mb}
storage_mb = ${storage_mb}
