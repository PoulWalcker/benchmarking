    input_schema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    output_schema:
      type: object
      properties:
        result_json: &id001
          type: string
      required:
      - result_json
      additionalProperties: false
  documents.read:
    kind: Script
    inputs: []
    outputs:
    - result_json
    implementation: environment_tool
    transport: http
    input_schema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    output_schema:
      type: object
      properties:
        result_json: *id001
      required:
      - result_json
      additionalProperties: false
  research.read:
    kind: Script
    inputs: []
    outputs:
    - result_json
    implementation: environment_tool
    transport: http
    input_schema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    output_schema:
      type: object
      properties:
        result_json: *id001
      required:
      - result_json
      additionalProperties: false
  crm.read:
    kind: Script
    inputs: []
    outputs:
    - result_json
    implementation: environment_tool
    transport: http
    input_schema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    output_schema:
      type: object
      properties:
        result_json: *id001
      required:
      - result_json
      additionalProperties: false
  customer.ask:
    kind: Script
    inputs:
    - questions
    outputs:
    - result_json
    implementation: environment_tool
    transport: http
    input_schema:
      type: object
      properties:
        questions: &id003
          type: array
          items: *id001
      required:
      - questions
      additionalProperties: false
    output_schema:
      type: object
      properties:
        result_json: *id001
      required:
      - result_json
      additionalProperties: false
  crm.update:
    kind: Script
    inputs:
    - changes
    outputs:
    - result_json
    implementation: environment_tool
    transport: http
    input_schema:
      type: object
      properties:
        changes:
          type: object
          properties: &id004
            status: *id001
            budget_aed: &id002
              type: integer
              minimum: 0
            timeline_weeks: *id002
            volume: *id002
            languages: *id003
            crm: *id001
            channel: *id001
            human_handoff:
              type: boolean
            next_action: *id001
            owner: *id001
          required: []
          additionalProperties: false
      required:
      - changes
      additionalProperties: false
    output_schema:
      type: object
      properties:
        result_json: *id001
      required:
      - result_json
      additionalProperties: false
    max_attempts: 2
  followup.create:
    kind: Script
    inputs:
    - lead_id
    - type
    - status
    outputs:
    - result_json
    implementation: environment_tool
    transport: http
    input_schema:
      type: object
      properties: &id005
        lead_id: *id001
        type: *id001
        status: *id001
      required:
      - lead_id
      - type
      - status
      additionalProperties: false
    output_schema:
      type: object
      properties:
        result_json: *id001
      required:
      - result_json
      additionalProperties: false
  customer.send:
    kind: Script
    inputs:
    - recipient
    - body
    outputs:
    - result_json
    implementation: environment_tool
    transport: http
    input_schema:
      type: object
      properties: &id006
        recipient: *id001
        body: *id001
      required:
      - recipient
      - body
      additionalProperties: false
    output_schema:
      type: object
      properties:
        result_json: *id001
      required:
      - result_json
      additionalProperties: false
  json.parse:
    kind: Script
    inputs:
    - text
    outputs:
    - value
    implementation: builtin JSON.parse
    input_schema:
      type: object
      properties:
        text: *id001
      required:
      - text
      additionalProperties: false
  report.evidence:
    kind: Script
    inputs:
    - narrative
    - evidence
    outputs:
    - final_answer
    implementation: builtin append literal receipt strings; does not infer success
    input_schema:
      type: object
      properties:
        narrative: *id001
        evidence: *id003
      required:
      - narrative
      - evidence
      additionalProperties: false
    output_schema:
      type: object
      properties:
        final_answer: *id001
      required:
      - final_answer
      additionalProperties: false
  crm.plan:
    kind: LLM
    inputs:
    - task
    - evidence
    outputs:
    - changes
    - followup
    - response
    - narrative
    implementation: agency
    prompt: Use only supplied inquiry, clarification, research, policy and current
      CRM evidence to assess fit and propose supported actions. Return qualification
      changes without modifying protected identity; followup parameters; appropriate
      customer response without unsupported commitments; and a concise narrative clearly
      identifying proposed actions and next steps, not claiming mutations already
      happened. Native workflow tools will perform actions afterward; final report
      must append actual receipts and readback. Do not use tools.
    input_schema:
      type: object
      properties:
        task: *id001
        evidence: *id003
      required:
      - task
      - evidence
      additionalProperties: false
    output_schema:
      type: object
      properties:
        changes:
          type: object
          properties: *id004
          required:
          - status
          - budget_aed
          - timeline_weeks
          - volume
          - languages
          - crm
          - channel
          - human_handoff
          - next_action
          - owner
          additionalProperties: false
        followup:
          type: object
          properties: *id005
          required:
          - lead_id
          - type
          - status
          additionalProperties: false
        response:
          type: object
          properties: *id006
          required:
          - recipient
          - body
          additionalProperties: false
        narrative: *id001
      required:
      - changes
      - followup
      - response
      - narrative
      additionalProperties: false
