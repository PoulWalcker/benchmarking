schema: sapi-lab/v0
spec_revision: 06ddd3333109cea8a2cb3071609070d7a3c0d3ff
workflow:
  id: two-audience-briefs
  revision: 1
  kind: Gantt
  inputs:
    product_material: The product supports offline inventory and CSV export.
    cooperatives_material: The service targets rural cooperatives through printed
      catalogues.
    clinics_material: The service targets dental clinics through SMS reminders.
  steps:
  - id: p
    kind: LLM
    uses: research.product
    with:
      material:
        ref: inputs.product_material
    actor: product
  - id: mc
    kind: LLM
    uses: research.marketing
    with:
      material:
        ref: inputs.cooperatives_material
    actor: market
  - id: jc
    kind: Script
    uses: research.combine
    with:
      product:
        ref: steps.p
      marketing:
        ref: steps.mc
    join: all_terminal
  - id: wc
    kind: LLM
    uses: research.write
    with:
      brief:
        ref: steps.jc
    actor: writer
  - id: mk
    kind: LLM
    uses: research.marketing
    with:
      material:
        ref: inputs.clinics_material
    actor: market
  - id: jk
    kind: Script
    uses: research.combine
    with:
      product:
        ref: steps.p
      marketing:
        ref: steps.mk
    join: all_terminal
  - id: wk
    kind: LLM
    uses: research.write
    with:
      brief:
        ref: steps.jk
    actor: writer
  dependencies:
  - - p
    - jc
  - - mc
    - jc
  - - jc
    - wc
  - - p
    - jk
  - - mk
    - jk
  - - jk
    - wk
  acceptance: Produce source-grounded results for every supplied input.
  output:
    cooperatives:
      ref: steps.wc
    clinics:
      ref: steps.wk
activation:
  kind: Callback
  rule_id: two-audience-briefs-requested
  hook: research.requested
  condition: valid_input
  reaction: Trigger
  workflow_ref:
    id: two-audience-briefs
    revision: 1
execution:
  concurrency: independent
  deadline_seconds: 120
  on_step_error: fail
actors:
  product:
    context_scope: product
    allowed_operations:
    - research.product
  market:
    context_scope: market
    allowed_operations:
    - research.marketing
  writer:
    context_scope: writer
    allowed_operations:
    - research.write
