operations:
  incident.read:
    kind: Script
    inputs: []
    outputs:
    - result_json
    implementation: environment_tool
    transport: http
    input_schema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    output_schema:
      type: object
      properties:
        result_json: &id001
          type: string
      required:
      - result_json
      additionalProperties: false
  source.read:
    kind: Script
    inputs: []
    outputs:
    - result_json
    implementation: environment_tool
    transport: http
    input_schema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    output_schema:
      type: object
      properties:
        result_json: *id001
      required:
      - result_json
      additionalProperties: false
  tests.run:
    kind: Script
    inputs: []
    outputs:
    - result_json
    implementation: environment_tool
    transport: http
    input_schema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    output_schema:
      type: object
      properties:
        result_json: *id001
      required:
      - result_json
      additionalProperties: false
  checkout.patch:
    kind: Script
    inputs:
    - old
    - new
    outputs:
    - result_json
    implementation: environment_tool
    transport: http
    input_schema:
      type: object
      properties:
        old: *id001
        new: *id001
      required:
      - old
      - new
      additionalProperties: false
    output_schema:
      type: object
      properties:
        result_json: *id001
      required:
      - result_json
      additionalProperties: false
  incident.plan:
    kind: LLM
    inputs:
    - task
    - evidence
    outputs:
    - old
    - new
    implementation: agency
    prompt: Analyze only the supplied incident, source and baseline test evidence.
      Identify the minimal literal source replacement addressing the root cause while
      preserving payment validation. Return old and new literal strings for the available
      constrained patch tool. Do not claim to have applied or tested it.
    input_schema:
      type: object
      properties:
        task: *id001
        evidence:
          type: array
          items: *id001
      required:
      - task
      - evidence
      additionalProperties: false
    output_schema:
      type: object
      properties:
        old: *id001
        new: *id001
      required:
      - old
      - new
      additionalProperties: false
  incident.summarize:
    kind: LLM
    inputs:
    - task
    - evidence
    outputs:
    - final_answer
    - incident_summary
    implementation: agency
    prompt: Write an accurate final answer and incident summary using only supplied
      task and tool evidence. Include root cause, impact, correction, verification
      of affected and previously working behavior, and limitations. Do not invent
      actions or results. Return final_answer and incident_summary as strings.
    input_schema:
      type: object
      properties:
        task: *id001
        evidence:
          type: array
          items: *id001
      required:
      - task
      - evidence
      additionalProperties: false
    output_schema:
      type: object
      properties:
        final_answer: *id001
        incident_summary: *id001
      required:
      - final_answer
      - incident_summary
      additionalProperties: false
