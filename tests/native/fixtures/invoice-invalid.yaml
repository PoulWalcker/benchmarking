activation:
  condition: valid_input
  hook: benchmark.invoice_batch_requested
  kind: Callback
  reaction: Trigger
  rule_id: invoices-requested
  workflow_ref:
    id: invoice-total
    revision: 1
execution:
  concurrency: independent
  deadline_seconds: 30
  on_step_error: fail
schema: sapi-lab/v0
spec_revision: 06ddd3333109cea8a2cb3071609070d7a3c0d3ff
workflow:
  acceptance: Every invoice is counted once; integer minor units and currency are
    preserved.
  dependencies:
  - - validate
    - total
  - - total
    - report
  id: invoice-total
  inputs:
    invoices:
    - amount_minor: 12500
      currency: AED
      id: INV-1
    - amount_minor: 8000
      currency: AED
      id: INV-2
    - amount_minor: 17500
      currency: AED
      id: INV-3
  kind: Pipeline
  output:
    currency: AED
    invoice_count: 3
    total_minor: 38000
  revision: 1
  steps:
  - id: validate
    kind: Script
    uses: arbitrary.shell
    with:
      invoices:
        ref: inputs.invoices
  - id: total
    kind: Script
    uses: invoices.sum
    with:
      invoices:
        ref: steps.validate.invoices
  - id: report
    kind: Script
    uses: invoices.report
    with:
      total:
        ref: steps.total
