schema: sapi-bindings/v0
target:
  demo: n8n_json
  code_node_version: 2
  merge_node_version: 3.2
  execution_order: v1
operations:
  transport.echo:
    kind: LLM
    inputs:
    - payload
    outputs:
    - category
    - priority
    implementation: agency_bridge
    prompt: Return the deterministic transport response.
    output_contract: '{category: transport, priority: accepted|alternate}'
    input_schema:
      type: object
      required:
      - payload
      additionalProperties: false
      properties:
        payload:
          type: object
          required:
          - sequence
          additionalProperties: false
          properties:
            sequence:
              type: integer
              minimum: 0
    output_schema:
      type: object
      required:
      - category
      - priority
      additionalProperties: false
      properties:
        category:
          type: string
          enum:
          - transport
        priority:
          type: string
          enum:
          - accepted
          - alternate
production_bridge_contract:
  scope: local_research_adapter
  transport: HTTP
  endpoint: /v1/agency/execute
  request_fields:
  - invocation_id
  - operation
  - actor
  - inputs
  response_fields:
  - invocation_id
  - output
  - usage
  - status
  authentication: deployment_binding
  state_restoration: wrapper_validates_response_and_attaches_output_to_original_envelope
  notes: Adapter owns model and deployment settings. No secrets are embedded in workflow
    exports. No retries or durable admission are implemented.
