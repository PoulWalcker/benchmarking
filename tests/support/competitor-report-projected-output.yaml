schema: sapi-lab/v0
spec_revision: 06ddd3333109cea8a2cb3071609070d7a3c0d3ff
actors:
  product-sapi:
    context_scope: product material
    allowed_operations: [research.product]
  marketing-sapi:
    context_scope: marketing material
    allowed_operations: [research.marketing]
  writer-sapi:
    context_scope: combined analyses
    allowed_operations: [research.write]
workflow:
  id: competitor-report
  revision: 1
  kind: Gantt
  inputs:
    product_material: Product supports billing and export.
    marketing_material: The service targets cafes through newsletters.
  steps:
    - id: product_analysis
      kind: LLM
      uses: research.product
      actor: product-sapi
      with:
        material: {ref: inputs.product_material}
    - id: marketing_analysis
      kind: LLM
      uses: research.marketing
      actor: marketing-sapi
      with:
        material: {ref: inputs.marketing_material}
    - id: combine
      kind: Script
      uses: research.combine
      join: all_terminal
      with:
        product: {ref: steps.product_analysis}
        marketing: {ref: steps.marketing_analysis}
    - id: write_report
      kind: LLM
      uses: research.write
      actor: writer-sapi
      with:
        brief: {ref: steps.combine}
  dependencies:
    - [product_analysis, combine]
    - [marketing_analysis, combine]
    - [combine, write_report]
  acceptance: Both nonempty sources are analyzed independently; the report covers only their stated facts and preserves both exact source excerpts in product then marketing order.
  output:
    report: {ref: steps.write_report.report}
    evidence: {ref: steps.write_report.evidence}
activation:
  kind: Callback
  rule_id: competitor-report-valid-input
  hook: competitor_material_submitted
  condition: valid_input
  reaction: Trigger
  workflow_ref:
    id: competitor-report
    revision: 1
execution:
  concurrency: independent
  deadline_seconds: 120
  on_step_error: fail