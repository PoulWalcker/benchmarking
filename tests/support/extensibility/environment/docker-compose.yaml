services:
  main:
    depends_on:
      beacon:
        condition: service_healthy
    networks: [calibration]
  beacon:
    build:
      context: ${CONTEXT_DIR}
      dockerfile: Dockerfile
    command: [python3, -m, payload.environment.server]
    networks: [calibration]
    cpus: 1
    mem_limit: 128m
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1).read()"]
      interval: 1s
      timeout: 2s
      retries: 30
networks:
  calibration:
    internal: true
