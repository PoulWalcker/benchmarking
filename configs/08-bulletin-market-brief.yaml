schema: sapi-lab/v0
spec_revision: 06ddd3333109cea8a2cb3071609070d7a3c0d3ff
workflow:
  id: bulletin-market-brief
  revision: 1
  kind: Gantt
  inputs:
    articles:
      - {id: BL-1, title: Offline inventory, text: The product supports offline inventory.}
      - {id: BL-2, title: CSV export, text: The product supports CSV export.}
    marketing_material: The service targets rural cooperatives through printed catalogues.
  steps:
    - id: prepare
      kind: Script
      uses: digest.prepare
      with: {articles: {ref: inputs.articles}}
    - id: summarize
      kind: LLM
      uses: digest.summarize
      actor: digest-editor
      with: {articles: {ref: steps.prepare.articles}}
    - id: preview
      kind: Script
      uses: digest.preview
      with: {summary: {ref: steps.summarize}}
    - id: product
      kind: LLM
      uses: research.product
      actor: product-analyst
      with: {material: {ref: steps.summarize.text}}
    - id: marketing
      kind: LLM
      uses: research.marketing
      actor: market-analyst
      with: {material: {ref: inputs.marketing_material}}
    - id: combine
      kind: Script
      uses: research.combine
      join: all_terminal
      with: {product: {ref: steps.product}, marketing: {ref: steps.marketing}}
    - id: write
      kind: LLM
      uses: research.write
      actor: brief-writer
      with: {brief: {ref: steps.combine}}
  dependencies:
    - [prepare, summarize]
    - [summarize, preview]
    - [summarize, product]
    - [product, combine]
    - [marketing, combine]
    - [combine, write]
  acceptance: Preserve bulletin facts, article IDs and source evidence through digest and brief.
  output: {digest: {ref: steps.preview}, brief: {ref: steps.write}}
activation:
  kind: Callback
  rule_id: bulletin-preview-requested
  hook: research.bulletin_preview_requested
  condition: valid_input
  reaction: Trigger
  workflow_ref: {id: bulletin-market-brief, revision: 1}
execution: {concurrency: independent, deadline_seconds: 120, on_step_error: fail}
actors:
  digest-editor: {context_scope: digest, allowed_operations: [digest.summarize]}
  product-analyst: {context_scope: product, allowed_operations: [research.product]}
  market-analyst: {context_scope: marketing, allowed_operations: [research.marketing]}
  brief-writer: {context_scope: writing, allowed_operations: [research.write]}
