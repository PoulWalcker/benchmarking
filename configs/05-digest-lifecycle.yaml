# The workflow is one candidate. Lifecycle controls its test/rebuild/release.
schema: sapi-lab/v0
spec_revision: 06ddd3333109cea8a2cb3071609070d7a3c0d3ff
workflow:
  id: daily-digest
  revision: 1
  kind: Gantt
  inputs:
    articles:
      - {id: a1, title: Warehouse opens, text: A new warehouse opened in Dubai.}
      - {id: a2, title: New payment option, text: The shop added a payment option.}
  steps:
    - id: prepare
      kind: Script
      uses: digest.prepare
      with:
        articles: {ref: inputs.articles}
    - id: summarize
      kind: LLM
      uses: digest.summarize
      with:
        articles: {ref: steps.prepare.articles}
    - id: preview
      kind: Script
      uses: digest.preview
      with:
        summary: {ref: steps.summarize}
  dependencies:
    - [prepare, summarize]
    - [summarize, preview]
  acceptance: Digest references supplied article IDs and contains a nonempty summary.
  output: {ref: steps.preview}
activation:
  kind: Cron
  rule_id: daily-digest-0900
  schedule: "0 9 * * *"
  timezone: Asia/Dubai
  enabled: false
  workflow_ref: {id: daily-digest, revision: 1}
execution:
  concurrency: independent
  deadline_seconds: 120
  on_step_error: fail
lifecycle:
  # Proposed orchestration configuration outside WorkflowDefinition.
  initial_state: draft
  test:
    initiator: Callback
    rule_id: digest-test-requested
    hook: digest.test_requested
    condition: test_environment_ready
    reaction: Trigger
    verifier: digest.acceptance_v1
    output_mode: preview
  on_test_pass:
    action: release_candidate
    enable_cron: daily-digest-0900
    retarget: exact_tested_revision
  on_test_fail:
    action: wbs_rebuild
    objective: Repair the candidate using verifier findings.
    source_work: current_candidate
    output: new_workflow_fork
    max_rebuilds: 2 # At most three tested candidates including the original.
    archive_original: after_fork_persisted
    next: request_test_via_callback
    exhausted: suspend_and_create_adhoc
  persistence:
    store: workflow_registry
    immutable_definitions: true
    record_test_results: true
    deduplicate_by: [rule_id, event_id]
  scheduling:
    overlap: skip_if_running
    missed_run: skip
    suspended: do_not_start
  replacement:
    in_flight: finish_pinned_revision
    activate_new_revision: after_previous_run_finishes
    restore_archive: restore_definition_without_replay

